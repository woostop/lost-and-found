<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- 찾아줘 배경용 손그림 느낌 지도 (원본 일러스트) -->
  <rect width="1200" height="900" fill="#f6f7f9"/>

  <!-- 공원 / 녹지 -->
  <path d="M60 520 q80 -60 170 -20 t150 40 q20 90 -70 130 t-200 -10 q-80 -60 -50 -140z" fill="#e3f4ea"/>
  <path d="M870 90 q110 -30 200 30 q50 70 -10 130 q-90 50 -180 0 q-70 -70 -10 -160z" fill="#e3f4ea"/>
  <circle cx="980" cy="700" r="70" fill="#e3f4ea"/>

  <!-- 강 -->
  <path d="M-20 300 C 180 250, 300 380, 520 340 S 820 200, 1000 300 S 1180 420, 1240 380"
        fill="none" stroke="#dbeafe" stroke-width="46" stroke-linecap="round"/>

  <!-- 큰 도로 -->
  <g fill="none" stroke="#e5e8eb" stroke-width="18" stroke-linecap="round">
    <path d="M0 160 H1200"/>
    <path d="M0 610 C 300 590, 700 640, 1200 600"/>
    <path d="M300 0 V900"/>
    <path d="M760 0 C 740 300, 800 600, 770 900"/>
  </g>

  <!-- 작은 골목 -->
  <g fill="none" stroke="#eceef1" stroke-width="7" stroke-linecap="round">
    <path d="M0 80 H1200"/><path d="M0 450 H1200"/><path d="M0 760 H1200"/><path d="M0 850 H1200"/>
    <path d="M140 0 V900"/><path d="M460 0 V900"/><path d="M600 0 V900"/>
    <path d="M920 0 V900"/><path d="M1080 0 V900"/>
  </g>

  <!-- 건물 블록 -->
  <g fill="#eef0f3">
    <rect x="160" y="190" width="120" height="70" rx="8"/>
    <rect x="480" y="180" width="100" height="90" rx="8"/>
    <rect x="620" y="470" width="120" height="110" rx="8"/>
    <rect x="320" y="470" width="120" height="110" rx="8"/>
    <rect x="940" y="470" width="120" height="100" rx="8"/>
    <rect x="160" y="780" width="120" height="50" rx="8"/>
    <rect x="480" y="780" width="100" height="50" rx="8"/>
    <rect x="800" y="780" width="100" height="50" rx="8"/>
    <rect x="320" y="20" width="120" height="45" rx="8"/>
    <rect x="620" y="20" width="120" height="45" rx="8"/>
  </g>

  <!-- 누군가 물건을 찾아 헤맨 점선 경로 -->
  <path d="M120 820 C 220 700, 260 560, 380 520 S 560 430, 660 400 S 860 260, 1010 200"
        fill="none" stroke="#3182f6" stroke-opacity=".35" stroke-width="4"
        stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- 위치 핀: 잃어버린 곳(빨강), 주운 곳(초록) -->
  <g>
    <path d="M380 520 c-18 0 -30 -13 -30 -29 c0 -22 30 -51 30 -51 s30 29 30 51 c0 16 -12 29 -30 29z"
          transform="translate(0 -6)" fill="#f04452" fill-opacity=".55"/>
    <circle cx="380" cy="486" r="9" fill="#fff"/>
  </g>
  <g>
    <path d="M1010 200 c-18 0 -30 -13 -30 -29 c0 -22 30 -51 30 -51 s30 29 30 51 c0 16 -12 29 -30 29z"
          transform="translate(0 -6)" fill="#03b26c" fill-opacity=".55"/>
    <circle cx="1010" cy="166" r="9" fill="#fff"/>
  </g>
  <g>
    <path d="M150 260 c-14 0 -24 -10 -24 -23 c0 -17 24 -40 24 -40 s24 23 24 40 c0 13 -10 23 -24 23z"
          fill="#f04452" fill-opacity=".35"/>
    <circle cx="150" cy="236" r="7" fill="#fff"/>
  </g>
  <g>
    <path d="M880 690 c-14 0 -24 -10 -24 -23 c0 -17 24 -40 24 -40 s24 23 24 40 c0 13 -10 23 -24 23z"
          fill="#03b26c" fill-opacity=".35"/>
    <circle cx="880" cy="666" r="7" fill="#fff"/>
  </g>

  <!-- 돋보기: 지도 위를 훑어보는 느낌 -->
  <g transform="translate(640 380) rotate(-20)">
    <circle r="78" fill="#3182f6" fill-opacity=".06" stroke="#3182f6" stroke-opacity=".35" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-dasharray="30 400" transform="rotate(-140)"/>
    <rect x="70" y="-12" width="90" height="24" rx="12" fill="#3182f6" fill-opacity=".35" transform="rotate(35)"/>
  </g>

  <!-- 물음표 마커 (로고 모티브) -->
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#3182f6" fill-opacity=".25">
    <text x="560" y="740" font-size="44">?</text>
    <text x="1110" y="520" font-size="36">?</text>
    <text x="230" y="400" font-size="32">?</text>
  </g>
</svg>
